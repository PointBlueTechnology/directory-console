# Every pull request and push to main: the web UI's type check, tests and build, then the Java
# modules' tests against DirXMLDev from Maven Central (with the built UI in the server).
name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: console-web/package-lock.json
      - name: Web UI
        working-directory: console-web
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
      - run: mvn -B test
